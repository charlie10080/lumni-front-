<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="lumniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#lumniGrad)" />

  <!-- Inner Subtle Overlay Grid/Glow -->
  <circle cx="256" cy="180" r="160" fill="#ffffff" opacity="0.08" />
  <circle cx="380" cy="380" r="120" fill="#f59e0b" opacity="0.15" />

  <!-- Sparkle Main Star -->
  <g filter="url(#glow)">
    <path d="M256 100 L275 210 L385 229 L275 248 L256 358 L237 248 L127 229 L237 210 Z" fill="url(#starGrad)" />
  </g>

  <!-- Secondary Mini Stars -->
  <path d="M370 120 L378 150 L408 158 L378 166 L370 196 L362 166 L332 158 L362 150 Z" fill="#ffffff" opacity="0.9" />
  <path d="M140 320 L146 345 L171 351 L146 357 L140 382 L134 357 L109 351 L134 345 Z" fill="#ffffff" opacity="0.8" />

  <!-- Graduation Cap Base Symbol -->
  <path d="M160 370 L256 420 L352 370 L256 320 Z" fill="#ffffff" opacity="0.95" />
  <path d="M200 395 L200 440 Q256 470 312 440 L312 395" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.95" />
  <path d="M340 378 L370 410 L370 445" fill="none" stroke="#fef08a" stroke-width="8" stroke-linecap="round" />
</svg>
