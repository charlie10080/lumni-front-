<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
  <title>LUMNI • Plataforma Escolar</title>
  
  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          },
          boxShadow: {
            'glow': '0 0 25px -3px rgba(99, 102, 241, 0.45)',
            'glow-lg': '0 0 40px -5px rgba(99, 102, 241, 0.6)'
          }
        }
      }
    };
  </script>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Custom Styles: Theme and Glassmorphism -->
  <style data-purpose="theme-styles">
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.4s ease, color 0.4s ease;
      background-color: #070913;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Fixed Fullscreen 3D Canvas Background */
    #three-canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 0;
      pointer-events: auto;
      overflow: hidden;
    }

    #three-canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Dark Theme Default */
    .theme-wrapper {
      background: transparent;
      color: #f8fafc;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: all 0.35s ease;
    }

    .input-glass {
      background: rgba(10, 13, 24, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
      transition: all 0.25s ease;
    }
    .input-glass:focus {
      border-color: #6366f1;
      background: rgba(14, 18, 34, 0.85);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .input-glass::placeholder {
      color: #64748b;
    }

    /* Light Theme Overrides */
    .light-theme {
      background-color: #e2e8f5;
    }
    .light-theme .theme-wrapper {
      color: #0f172a;
    }

    .light-theme .glass-card {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 20px 45px -10px rgba(99, 102, 241, 0.18), 0 4px 16px -2px rgba(0, 0, 0, 0.05), inset 0 1px 0 #ffffff;
    }

    .light-theme .input-glass {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #cbd5e1;
      color: #0f172a;
    }
    .light-theme .input-glass:focus {
      border-color: #4f46e5;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.18);
    }
    .light-theme .input-glass::placeholder {
      color: #94a3b8;
    }

    .light-theme .text-slate-muted {
      color: #475569 !important;
    }
    .light-theme .text-heading {
      color: #0f172a !important;
    }
    .light-theme .role-pill-inactive {
      color: #64748b !important;
    }
    .light-theme .role-pill-inactive:hover {
      color: #1e293b !important;
    }
    .light-theme .tab-inactive {
      color: #64748b !important;
    }
    .light-theme .tab-inactive:hover {
      color: #1e293b !important;
    }
    .light-theme .link-forgot {
      color: #4f46e5 !important;
    }
    .light-theme .link-forgot:hover {
      color: #3730a3 !important;
    }
    .light-theme .install-pill {
      background: rgba(255, 255, 255, 0.75) !important;
      border-color: #cbd5e1 !important;
      color: #334155 !important;
    }
    .light-theme .install-pill:hover {
      background: rgba(241, 245, 249, 0.95) !important;
      border-color: #94a3b8 !important;
    }
    .light-theme .role-switcher-bg {
      background-color: rgba(226, 232, 240, 0.7) !important;
      border-color: rgba(203, 213, 225, 0.8) !important;
    }
    .light-theme .border-tab-divider {
      border-color: rgba(203, 213, 225, 0.6) !important;
    }
  </style>
</head>
<body class="min-h-screen relative overflow-x-hidden selection:bg-brand-500 selection:text-white">

  <!-- BEGIN: Three.js Interactive 3D Particle Globe & Galaxy -->
  <div id="three-canvas-container"></div>
  <!-- END: Three.js Interactive 3D Particle Globe & Galaxy -->

  <!-- BEGIN: MainContainer -->
  <div class="theme-wrapper pointer-events-none relative z-10 min-h-screen min-h-[100dvh] w-full flex flex-col justify-center items-center px-4 py-6 sm:py-10">
    
    <!-- Top toolbar with theme switcher -->
    <header class="w-full max-w-[420px] flex justify-end items-center mb-3 px-1 pointer-events-auto" data-purpose="top-navigation">
      <button aria-label="Cambiar tema de color" class="flex items-center justify-center w-10 h-10 rounded-full glass-card border border-white/10 hover:scale-105 active:scale-95 transition-all text-indigo-400 dark:text-indigo-300 shadow-md backdrop-blur-md cursor-pointer" id="themeToggleBtn" type="button">
        <!-- Sun Icon (visible in dark mode) -->
        <svg aria-hidden="true" class="w-5 h-5 block" id="sunIcon" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
        <!-- Moon Icon (visible in light mode) -->
        <svg aria-hidden="true" class="w-5 h-5 hidden text-indigo-600" id="moonIcon" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></svg>
      </button>
    </header>

    <!-- BEGIN: AuthCardWrapper -->
    <main class="w-full max-w-[420px] glass-card rounded-3xl p-6 sm:p-8 flex flex-col items-center shadow-2xl relative pointer-events-auto" data-purpose="auth-card">
      <!-- Glow Accent behind Card Header -->
      <div class="absolute -top-10 left-1/2 -translate-x-1/2 w-44 h-44 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>

      <!-- BEGIN: BrandIdentity -->
      <div class="flex flex-col items-center text-center mb-6 z-10" data-purpose="brand-header">
        <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-amber-300 p-[1.5px] shadow-glow mb-4 flex items-center justify-center">
          <div class="w-full h-full rounded-[15px] bg-gradient-to-br from-indigo-500 to-indigo-700 flex items-center justify-center relative overflow-hidden">
            <div class="absolute inset-0 bg-white/10 backdrop-blur-sm"></div>
            <svg aria-hidden="true" class="w-8 h-8 sm:w-9 sm:h-9 text-white relative z-10 drop-shadow" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"><circle cx="4" cy="20" r="2"></circle></path></svg>
          </div>
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-wider text-white text-heading mb-2">LUMNI</h1>
        <p class="text-xs sm:text-sm font-medium text-slate-400 text-slate-muted flex items-center justify-center gap-1.5 flex-wrap">
          <svg aria-hidden="true" class="w-4 h-4 text-indigo-400 inline shrink-0" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M14 21v-3a2 2 0 0 0-4 0v3"></path><path d="M18 4.933V21"></path><path d="m4 6 7.106-3.79a2 2 0 0 1 1.788 0L20 6"></path><path d="m6 11-3.52 2.147a1 1 0 0 0-.48.854V19a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a1 1 0 0 0-.48-.853L18 11"></path><path d="M6 4.933V21"></path><circle cx="12" cy="9" r="2"></circle></svg>
          <span>Plataforma Escolar • Docentes y Familias</span>
        </p>
      </div>
      <!-- END: BrandIdentity -->

      <!-- BEGIN: RoleSegmentedSwitcher -->
      <div class="role-switcher-bg w-full bg-slate-900/60 dark:bg-black/40 border border-white/10 p-1 rounded-2xl flex items-center mb-6 shadow-inner transition-colors" data-purpose="role-switcher">
        <button class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl font-medium text-xs sm:text-sm transition-all duration-300 bg-gradient-to-r from-indigo-600 to-indigo-500 text-white shadow-md cursor-pointer" id="btnDocentes" type="button">
          <svg aria-hidden="true" class="w-4 h-4 shrink-0" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="m16 11 2 2 4-4"></path><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
          <span>Docentes</span>
        </button>
        <button class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl font-medium text-xs sm:text-sm text-slate-400 role-pill-inactive hover:text-white transition-all duration-300 cursor-pointer" id="btnPadres" type="button">
          <svg aria-hidden="true" class="w-4 h-4 shrink-0" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M16 3.128a4 4 0 0 1 0 7.744"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><circle cx="9" cy="7" r="4"></circle></svg>
          <span>Padres y Tutores</span>
        </button>
      </div>
      <!-- END: RoleSegmentedSwitcher -->

      <!-- BEGIN: AuthSubTabs -->
      <div class="border-tab-divider w-full flex items-center justify-start border-b border-white/10 dark:border-white/10 mb-6 gap-6 px-1 transition-colors" data-purpose="auth-tabs">
        <button class="pb-2.5 text-xs sm:text-sm font-semibold text-white text-heading border-b-2 border-indigo-500 tracking-wide transition-colors cursor-pointer" id="tabLogin" type="button">
          Iniciar Sesión
        </button>
        <button class="pb-2.5 text-xs sm:text-sm font-medium text-slate-400 tab-inactive hover:text-white flex items-center gap-1.5 transition-colors cursor-pointer" id="tabRegister" type="button">
          <svg aria-hidden="true" class="w-3.5 h-3.5" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" x2="19" y1="8" y2="14"></line><line x1="22" x2="16" y1="11" y2="11"></line></svg>
          <span id="registerTabText">Crear Cuenta de Maestro</span>
        </button>
      </div>
      <!-- END: AuthSubTabs -->

      <!-- BEGIN: LoginForm -->
      <form class="w-full space-y-4" data-purpose="login-form" id="mainLoginForm" onsubmit="event.preventDefault();">
        <!-- Dynamic Identifier/Email Input -->
        <div class="space-y-1.5">
          <label class="block text-[10px] sm:text-xs font-bold tracking-wider text-slate-400 text-slate-muted uppercase transition-all duration-200" for="emailInput" id="emailLabel">
            CORREO ELECTRÓNICO INSTITUCIONAL
          </label>
          <div class="relative flex items-center">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg aria-hidden="true" class="w-4 h-4" id="emailIcon" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path><rect height="16" rx="2" width="20" x="2" y="4"></rect></svg>
            </div>
            <input autocomplete="email" class="input-glass w-full rounded-xl pl-10 pr-4 py-3 text-xs sm:text-sm outline-none transition-all duration-200" id="emailInput" name="email" placeholder="tu.nombre@colegio.edu.mx" required="" type="text"/>
          </div>
        </div>

        <!-- Password Input -->
        <div class="space-y-1.5" id="passwordGroup">
          <label class="block text-[10px] sm:text-xs font-bold tracking-wider text-slate-400 text-slate-muted uppercase" for="passwordInput">
            CONTRASEÑA
          </label>
          <div class="relative flex items-center">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg aria-hidden="true" class="w-4 h-4" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><rect height="11" rx="2" ry="2" width="18" x="3" y="11"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <input autocomplete="current-password" class="input-glass w-full rounded-xl pl-10 pr-11 py-3 text-xs sm:text-sm outline-none tracking-widest font-mono" id="passwordInput" name="password" placeholder="••••••••••••" required="" type="password"/>
            
            <!-- Toggle password visibility button -->
            <button aria-label="Mostrar o ocultar contraseña" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-indigo-400 transition-colors cursor-pointer" id="togglePasswordBtn" type="button">
              <svg aria-hidden="true" class="w-4 h-4" id="eyeOpenIcon" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg aria-hidden="true" class="w-4 h-4 hidden" id="eyeCloseIcon" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg>
            </button>
          </div>
        </div>

        <!-- Forgot Password Link -->
        <div class="flex justify-end pt-1" id="forgotPasswordGroup">
          <a class="text-xs font-medium text-indigo-400 link-forgot hover:text-indigo-300 hover:underline transition-colors cursor-pointer" href="#" id="forgotPasswordLink">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button class="w-full py-3.5 px-4 rounded-xl font-bold text-sm sm:text-base text-white bg-gradient-to-r from-indigo-600 via-indigo-500 to-indigo-600 hover:from-indigo-500 hover:to-indigo-500 shadow-glow hover:shadow-glow-lg active:scale-[0.99] transition-all flex items-center justify-center gap-2 group cursor-pointer" type="submit" id="submitBtn">
            <span id="submitBtnText">Ingresar a mi Aula</span>
            <svg aria-hidden="true" class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
          </button>
        </div>

        <!-- Divider Line -->
        <div class="pt-3">
          <hr class="border-white/10"/>
        </div>

        <!-- Bottom Action: Install App Pill -->
        <div class="pt-2 flex justify-center">
          <button class="install-pill w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-full bg-slate-900/50 border border-white/10 hover:border-indigo-400/40 text-slate-300 text-xs sm:text-sm font-medium transition-all duration-200 backdrop-blur-sm cursor-pointer" type="button">
            <span class="text-base leading-none">📲</span>
            <span>¿Deseas instalar la app en tu celular?</span>
          </button>
        </div>
      </form>
      <!-- END: LoginForm -->
    </main>
    <!-- END: AuthCardWrapper -->
  </div>
  <!-- END: MainContainer -->

  <!-- BEGIN: VanillaJSInteractivity & ThreeJSGalaxy -->
  <script data-purpose="threejs-and-ui">
    document.addEventListener('DOMContentLoaded', () => {
      // --- 1. CONFIGURACIÓN DE ROLES DINÁMICOS ---
      const ROLE_CONFIG = {
        docentes: {
          label: 'CORREO ELECTRÓNICO INSTITUCIONAL',
          placeholder: 'tu.nombre@colegio.edu.mx',
          submit: 'Ingresar a mi Aula',
          registerTab: 'Crear Cuenta de Maestro',
          submitGradient: 'from-indigo-600 via-indigo-500 to-indigo-600',
          shadowClass: 'shadow-glow',
          showPassword: true
        },
        padres: {
          label: 'CURP O MATRÍCULA DEL ALUMNO',
          placeholder: 'Ej. RAMJ120405HDFRRL01 o MAT-001',
          submit: 'Consultar Expediente del Alumno',
          registerTab: 'Portal de Consulta',
          submitGradient: 'from-amber-600 via-amber-500 to-amber-600',
          shadowClass: 'shadow-md shadow-amber-600/30',
          showPassword: false
        }
      };

      const btnDocentes = document.getElementById('btnDocentes');
      const btnPadres = document.getElementById('btnPadres');
      const emailLabel = document.getElementById('emailLabel');
      const emailInput = document.getElementById('emailInput');
      const passwordGroup = document.getElementById('passwordGroup');
      const forgotPasswordGroup = document.getElementById('forgotPasswordGroup');
      const submitBtn = document.getElementById('submitBtn');
      const submitBtnText = document.getElementById('submitBtnText');
      const registerTabText = document.getElementById('registerTabText');

      const activePillClasses = "flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl font-medium text-xs sm:text-sm transition-all duration-300 bg-gradient-to-r from-indigo-600 to-indigo-500 text-white shadow-md cursor-pointer";
      const inactivePillClasses = "flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl font-medium text-xs sm:text-sm text-slate-400 role-pill-inactive hover:text-white transition-all duration-300 cursor-pointer";

      function setRole(roleKey) {
        const config = ROLE_CONFIG[roleKey];
        if (!config) return;

        if (roleKey === 'docentes') {
          btnDocentes.className = activePillClasses;
          btnPadres.className = inactivePillClasses;
          passwordGroup.style.display = 'block';
          forgotPasswordGroup.style.display = 'flex';
          submitBtn.className = "w-full py-3.5 px-4 rounded-xl font-bold text-sm sm:text-base text-white bg-gradient-to-r from-indigo-600 via-indigo-500 to-indigo-600 hover:from-indigo-500 hover:to-indigo-500 shadow-glow hover:shadow-glow-lg active:scale-[0.99] transition-all flex items-center justify-center gap-2 group cursor-pointer";
        } else {
          btnPadres.className = activePillClasses;
          btnDocentes.className = inactivePillClasses;
          passwordGroup.style.display = 'none';
          forgotPasswordGroup.style.display = 'none';
          submitBtn.className = "w-full py-3.5 px-4 rounded-xl font-bold text-sm sm:text-base text-white bg-gradient-to-r from-amber-600 via-amber-500 to-amber-600 hover:from-amber-500 hover:to-amber-500 shadow-md shadow-amber-600/30 active:scale-[0.99] transition-all flex items-center justify-center gap-2 group cursor-pointer";
        }

        emailLabel.textContent = config.label;
        emailInput.placeholder = config.placeholder;
        submitBtnText.textContent = config.submit;
        registerTabText.textContent = config.registerTab;
      }

      btnDocentes.addEventListener('click', () => setRole('docentes'));
      btnPadres.addEventListener('click', () => setRole('padres'));

      // --- 2. THREE.JS LIVE 3D GLOBE & GALAXY ---
      const container = document.getElementById('three-canvas-container');
      const scene = new THREE.Scene();
      
      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );

      function updateCameraPosition() {
        const aspect = window.innerWidth / window.innerHeight;
        camera.aspect = aspect;
        if (aspect < 0.7) {
          camera.position.z = 62;
        } else if (aspect < 1.0) {
          camera.position.z = 70;
        } else {
          camera.position.z = 82;
        }
        camera.updateProjectionMatrix();
      }
      updateCameraPosition();

      const renderer = new THREE.WebGLRenderer({ 
        alpha: true, 
        antialias: true, 
        powerPreference: 'high-performance' 
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      container.appendChild(renderer.domElement);

      function createGlowPointTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 30);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        gradient.addColorStop(0.2, 'rgba(165, 180, 252, 0.9)');
        gradient.addColorStop(0.5, 'rgba(99, 102, 241, 0.4)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(canvas);
      }

      const pointTexture = createGlowPointTexture();
      const galaxyGroup = new THREE.Group();
      scene.add(galaxyGroup);

      // A. Globo de Partículas
      const globeRadius = 25;
      const globePointsCount = 2800;
      const globePositions = new Float32Array(globePointsCount * 3);
      const globeColors = new Float32Array(globePointsCount * 3);

      const colorElectricCyan = new THREE.Color(0x22d3ee);
      const colorNeonIndigo = new THREE.Color(0x6366f1);
      const colorElectricViolet = new THREE.Color(0x818cf8);
      const colorDeepPurple = new THREE.Color(0xa855f7);

      for (let i = 0; i < globePointsCount; i++) {
        const phi = Math.acos(-1 + (2 * i) / globePointsCount);
        const theta = Math.sqrt(globePointsCount * Math.PI) * phi;

        const x = globeRadius * Math.cos(theta) * Math.sin(phi);
        const y = globeRadius * Math.sin(theta) * Math.sin(phi);
        const z = globeRadius * Math.cos(phi);

        globePositions[i * 3] = x;
        globePositions[i * 3 + 1] = y;
        globePositions[i * 3 + 2] = z;

        const mixedColor = new THREE.Color();
        const ratio = (y + globeRadius) / (globeRadius * 2);
        if (ratio < 0.4) {
          mixedColor.lerpColors(colorElectricCyan, colorNeonIndigo, ratio / 0.4);
        } else if (ratio < 0.75) {
          mixedColor.lerpColors(colorNeonIndigo, colorElectricViolet, (ratio - 0.4) / 0.35);
        } else {
          mixedColor.lerpColors(colorElectricViolet, colorDeepPurple, (ratio - 0.75) / 0.25);
        }

        globeColors[i * 3] = mixedColor.r;
        globeColors[i * 3 + 1] = mixedColor.g;
        globeColors[i * 3 + 2] = mixedColor.b;
      }

      const globeGeometry = new THREE.BufferGeometry();
      globeGeometry.setAttribute('position', new THREE.BufferAttribute(globePositions, 3));
      globeGeometry.setAttribute('color', new THREE.BufferAttribute(globeColors, 3));

      const globeMaterial = new THREE.PointsMaterial({
        size: 1.5,
        map: pointTexture,
        vertexColors: true,
        transparent: true,
        opacity: 0.92,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const globe = new THREE.Points(globeGeometry, globeMaterial);
      galaxyGroup.add(globe);

      // B. Anillos Galácticos
      function createGalacticRing(innerRadius, outerRadius, count, tintColor, tiltX, tiltZ) {
        const ringGeo = new THREE.BufferGeometry();
        const ringPos = new Float32Array(count * 3);
        const ringCol = new Float32Array(count * 3);
        const baseColor = new THREE.Color(tintColor);

        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const rad = innerRadius + Math.random() * (outerRadius - innerRadius);
          const spreadY = (Math.random() - 0.5) * 3;

          ringPos[i * 3] = Math.cos(angle) * rad;
          ringPos[i * 3 + 1] = spreadY;
          ringPos[i * 3 + 2] = Math.sin(angle) * rad;

          ringCol[i * 3] = baseColor.r + (Math.random() - 0.5) * 0.15;
          ringCol[i * 3 + 1] = baseColor.g + (Math.random() - 0.5) * 0.15;
          ringCol[i * 3 + 2] = baseColor.b;
        }

        ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
        ringGeo.setAttribute('color', new THREE.BufferAttribute(ringCol, 3));

        const ringMat = new THREE.PointsMaterial({
          size: 1.3,
          map: pointTexture,
          vertexColors: true,
          transparent: true,
          opacity: 0.88,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });

        const ringMesh = new THREE.Points(ringGeo, ringMat);
        ringMesh.rotation.x = tiltX;
        ringMesh.rotation.z = tiltZ;
        return ringMesh;
      }

      const outerRing1 = createGalacticRing(32, 45, 1700, 0x6366f1, 0.45, 0.25);
      const outerRing2 = createGalacticRing(36, 50, 1300, 0x22d3ee, -0.3, -0.4);
      galaxyGroup.add(outerRing1);
      galaxyGroup.add(outerRing2);

      // C. Fondo Estelar
      const starsCount = 1000;
      const starPositions = new Float32Array(starsCount * 3);
      for (let i = 0; i < starsCount; i++) {
        starPositions[i * 3] = (Math.random() - 0.5) * 260;
        starPositions[i * 3 + 1] = (Math.random() - 0.5) * 260;
        starPositions[i * 3 + 2] = (Math.random() - 0.5) * 200 - 30;
      }

      const starGeometry = new THREE.BufferGeometry();
      starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));

      const starMaterial = new THREE.PointsMaterial({
        size: 0.9,
        color: 0xc7d2fe,
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending,
        map: pointTexture,
        depthWrite: false
      });

      const stars = new THREE.Points(starGeometry, starMaterial);
      scene.add(stars);

      // Interacción Mouse / Touch
      let mouseX = 0;
      let mouseY = 0;
      let targetX = 0;
      let targetY = 0;

      function onPointerMove(clientX, clientY) {
        const halfWidth = window.innerWidth / 2;
        const halfHeight = window.innerHeight / 2;
        targetX = (clientX - halfWidth) * 0.0012;
        targetY = (clientY - halfHeight) * 0.0012;
      }

      window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY), { passive: true });
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });

      window.addEventListener('resize', () => {
        updateCameraPosition();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      });

      // --- 3. CICLO DE ANIMACIÓN CON GESTIÓN DE VISIBILIDAD (PAGE VISIBILITY API) ---
      let clock = new THREE.Clock();
      let animFrameId = null;

      function animate() {
        if (document.hidden) return;
        
        animFrameId = requestAnimationFrame(animate);
        const elapsedTime = clock.getElapsedTime();

        mouseX += (targetX - mouseX) * 0.06;
        mouseY += (targetY - mouseY) * 0.06;

        globe.rotation.y = elapsedTime * 0.15 + mouseX;
        globe.rotation.x = Math.sin(elapsedTime * 0.08) * 0.1 + mouseY;

        outerRing1.rotation.y = elapsedTime * 0.07;
        outerRing1.rotation.z = 0.25 + Math.sin(elapsedTime * 0.2) * 0.05;

        outerRing2.rotation.y = -elapsedTime * 0.09;

        galaxyGroup.position.y = Math.sin(elapsedTime * 0.5) * 1.5;
        galaxyGroup.rotation.y = mouseX * 0.9;
        galaxyGroup.rotation.x = mouseY * 0.9;

        starMaterial.opacity = 0.55 + Math.sin(elapsedTime * 2.2) * 0.25;

        renderer.render(scene, camera);
      }

      animate();

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (animFrameId) {
            cancelAnimationFrame(animFrameId);
            animFrameId = null;
          }
        } else {
          clock.start();
          animate();
        }
      });

      // --- 4. TOGGLE TEMA CLARO / OSCURO ---
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      const htmlElement = document.documentElement;
      const bodyElement = document.body;
      const sunIcon = document.getElementById('sunIcon');
      const moonIcon = document.getElementById('moonIcon');

      let isLight = false;

      themeToggleBtn.addEventListener('click', () => {
        isLight = !isLight;
        if (isLight) {
          htmlElement.classList.remove('dark');
          bodyElement.classList.add('light-theme');
          sunIcon.classList.add('hidden');
          moonIcon.classList.remove('hidden');
          globeMaterial.opacity = 0.95;
          outerRing1.material.opacity = 0.9;
        } else {
          htmlElement.classList.add('dark');
          bodyElement.classList.remove('light-theme');
          sunIcon.classList.remove('hidden');
          moonIcon.classList.add('hidden');
          globeMaterial.opacity = 0.92;
          outerRing1.material.opacity = 0.88;
        }
      });

      // --- 5. TOGGLE VISIBILIDAD DE CONTRASEÑA ---
      const passwordInput = document.getElementById('passwordInput');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const eyeOpenIcon = document.getElementById('eyeOpenIcon');
      const eyeCloseIcon = document.getElementById('eyeCloseIcon');

      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        if (isPassword) {
          passwordInput.setAttribute('type', 'text');
          eyeOpenIcon.classList.add('hidden');
          eyeCloseIcon.classList.remove('hidden');
        } else {
          passwordInput.setAttribute('type', 'password');
          eyeOpenIcon.classList.remove('hidden');
          eyeCloseIcon.classList.add('hidden');
        }
      });

      // --- 6. FUNCIONALIDAD DE ACCESO Y REDIRECCIÓN ---
      const mainLoginForm = document.getElementById('mainLoginForm');
      mainLoginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const activeRole = btnDocentes.classList.contains('bg-gradient-to-r') ? 'teacher' : 'parent';
        localStorage.setItem('lumni_is_authenticated', 'true');
        localStorage.setItem('lumni_active_role', activeRole);
        
        // Redirigir a la app principal
        window.location.href = '/';
      });
    });
  </script>
  <!-- END: VanillaJSInteractivity & ThreeJSGalaxy -->
